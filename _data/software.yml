# Software projects, shown on the Software page in the order listed.
# Each entry needs: name, description
# Optional: authors, website, repo, docs, paper
- name: Phentax
  authors: A. Santini, D. Bandopadhyay
  website: https://github.com/asantini29/phentax
  docs: https://asantini29.github.io/phentax/
  paper: In preparation
  description: >-
    A JAX implementation of the IMRPhenomTHM waveform model, designed for efficient analysis of gravitational wave signals from binary black hole mergers. It natively supports GPU acceleration, automatic differentiation, and vectorization, making it suitable for high-performance computing applications in gravitational wave astronomy.

- name: Cantuccio
  authors: A. Santini
  website: https://github.com/asantini29/cantuccio
  docs: https://asantini29.github.io/cantuccio/
  description: >-
    A Python package for beautiful corner and violin plots, with a focus on publication-ready figures. Its interface is highly customizable, and it is designed to handle the scaling of labels, legends and ticks with the number of parameters, making it suitable for high-dimensional data visualization.

- name: CudAkima
  authors: A. Santini 
  website: https://github.com/asantini29/CudAkima
  docs: https://asantini29.github.io/CudAkima/index.html
  paper: Included in https://journals.aps.org/prd/abstract/10.1103/csx9-9trp.
  description: >-
    A tool for parallel Akima splines interpolation on GPUs, implemented in numba/cuda. It is designed to efficiently handle batched interpolation tasks with different input sizes, making it suitable for applications in scientific computing and data analysis.
